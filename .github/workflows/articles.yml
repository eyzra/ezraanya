name: Build articles

# Turns the Markdown files in /articles into data/articles.json and feed.xml.
# Runs whenever you add or change an article, or by hand from the Actions tab.
on:
  push:
    paths:
      - 'articles/**'
      - 'scripts/build-articles.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: articles
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build articles and feed
        run: node scripts/build-articles.mjs
      - name: Save the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json feed.xml
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update articles"
            git pull --rebase
            git push
          fi
