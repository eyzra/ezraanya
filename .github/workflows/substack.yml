name: Sync Substack posts

on:
  schedule:
    - cron: '17 */6 * * *'   # every six hours
  workflow_dispatch:          # run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-substack.mjs
      - name: Commit if posts changed
        run: |
          git config user.name "substack-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/posts.json
          git diff --cached --quiet || (git commit -m "Update Substack posts" && git push)
